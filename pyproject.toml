[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optima-flash"
version = "0.1.0"
description = "Socle du projet Optima Telecom Flash Tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Optima Telecom" }]
dependencies = [
    "PySide6>=6.6,<7",
    "pyusb>=1.2,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
    "pip-licenses",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/core", "src/adapters", "src/ui"]

[[tool.mypy.overrides]]
module = ["usb.*", "yaml.*"]
ignore_missing_imports = true